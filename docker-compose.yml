services:
  postgres:
    image: postgres:17-alpine
    container_name: clinica-medica-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-clinica_medica}
      POSTGRES_USER: ${DB_USERNAME:-clinica}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-clinica_dev}

    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-clinica} -d ${DB_NAME:-clinica_medica}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - clinica-network

volumes:
  postgres_data:
    name: clinica-medica-postgres-data

networks:
  clinica-network:
    name: clinica-medica-network