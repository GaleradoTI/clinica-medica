spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clinica_medica}
    username: ${DB_USERNAME:clinica}
    password: ${DB_PASSWORD:clinica_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  docker:
    compose:
      enabled: false

logging:
  level:
    root: INFO
    br.com.galeradoti.clinica: DEBUG
    org.hibernate.SQL: DEBUG