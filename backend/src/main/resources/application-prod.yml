spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  docker:
    compose:
      enabled: false

logging:
  level:
    root: INFO
    br.com.galeradoti.clinica: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  security:
    jwt:
      secret: ${JWT_SECRET_BASE64}

    cookie:
      secure: true
      same-site: Strict

  bootstrap:
    admin:
      enabled: false